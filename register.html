<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SurveyKazi | Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      margin-bottom: 17px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .terms {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 20px;
      font-size: 14px;
      color: #667085;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #667085;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #667085;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SurveyKazi</div>

    <h1>Create Your Account</h1>

    <p class="subtitle">
      Join SurveyKazi and explore available surveys.
    </p>

    <form onsubmit="registerUser(event)">

      <label>Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="e.g. 0712345678"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <div class="terms">
        <input type="checkbox" required>

        <span>
          I agree to the SurveyKazi terms and conditions.
        </span>
      </div>

      <button type="submit">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
      ← Back to SurveyKazi
    </a>

  </div>


  <script>

    function registerUser(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value;

      alert(
        "Welcome to SurveyKazi, " +
        name +
        "! Your registration system will be connected to a secure database next."
      );

    }

  </script>

</body>
  </html>
