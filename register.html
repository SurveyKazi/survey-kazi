<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - SurveyKazi</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

header {
    background: #0b5ed7;
    color: white;
    text-align: center;
    padding: 18px;
}

.container {
    max-width: 450px;
    margin: 35px auto;
    padding: 0 18px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    color: #0b5ed7;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.checkbox {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    font-size: 13px;
}

.checkbox input {
    width: auto;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #0b5ed7;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.link {
    text-align: center;
    margin-top: 18px;
}

.link a {
    color: #0b5ed7;
    text-decoration: none;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0b5ed7;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>SurveyKazi</h1>
</header>

<div class="container">

<div class="card">

<h2>Create Your Account</h2>

<form onsubmit="register(event)">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Email Address</label>
<input type="email" id="email" required>

<label>Phone Number</label>
<input type="tel" id="phone" required>

<label>Password</label>
<input type="password" id="password" required>

<div class="checkbox">
<input type="checkbox" id="terms" required>
<span>I agree to the SurveyKazi terms and conditions.</span>
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="link">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<a href="index.html" class="back">
← Back to Home
</a>

</div>

<script>

function register(event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    // Demo account storage
    localStorage.setItem("surveyUser", JSON.stringify({
        name: name,
        email: email,
        phone: phone,
        password: password
    }));

    // Start account with zero points
    localStorage.setItem("surveyPoints", "0");
    localStorage.setItem("completedSurveys", "0");
    localStorage.setItem("surveyTransactions", "[]");

    alert("Account created successfully!");

    window.location.href = "login.html";
}

</script>

</body>
</html>
