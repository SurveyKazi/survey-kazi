<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SurveyKazi</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
}

header {
    background: #0b5ed7;
    color: white;
    text-align: center;
    padding: 18px;
}

.container {
    max-width: 450px;
    margin: 35px auto;
    padding: 0 18px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    color: #0b5ed7;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #0b5ed7;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.link {
    text-align: center;
    margin-top: 18px;
}

.link a {
    color: #0b5ed7;
    text-decoration: none;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0b5ed7;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>SurveyKazi</h1>
</header>

<div class="container">

<div class="card">

<h2>Login</h2>

<form onsubmit="login(event)">

<label>Email Address</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit">
Login
</button>

</form>

<div class="link">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

</div>

<a href="index.html" class="back">
← Back to Home
</a>

</div>

<script>

function login(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const savedUser =
        JSON.parse(
            localStorage.getItem("surveyUser")
        );


    // Check if account exists
    if (!savedUser) {

        alert(
            "No account found. Please create an account first."
        );

        return;
    }


    // Check login details
    if (
        email === savedUser.email &&
        password === savedUser.password
    ) {

        localStorage.setItem(
            "surveyLoggedIn",
            "true"
        );

        window.location.href =
            "dashboard.html";

    } else {

        alert(
            "Incorrect email or password."
        );

    }

}

</script>

</body>
</html>
