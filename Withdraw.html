<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - SurveyKazi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 18px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .balance {
            text-align: center;
        }

        .balance h2 {
            color: #0b5ed7;
            font-size: 32px;
            margin: 8px 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            color: #0b5ed7;
            text-decoration: none;
            font-weight: bold;
        }

        .note {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>SurveyKazi</h1>
</header>

<div class="container">

    <div class="card balance">
        <p>Available Balance</p>
        <h2><span id="balance">0</span> Points</h2>
    </div>

    <div class="card">

        <h2>Request Withdrawal</h2>

        <label for="method">Payment Method</label>

        <select id="method">
            <option value="M-PESA">M-PESA</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>


        <label for="account">Phone Number / Account Number</label>

        <input
            type="text"
            id="account"
            placeholder="Enter phone or account number"
        >


        <label for="amount">Points to Withdraw</label>

        <input
            type="number"
            id="amount"
            placeholder="Enter points"
            min="1"
        >


        <button onclick="requestWithdrawal()">
            Request Withdrawal
        </button>

        <div class="note">
            Demo only: withdrawal requests are recorded locally.
            Real payment processing will be connected later.
        </div>

    </div>

    <a href="transactions.html" class="back">
        View Transaction History →
    </a>

    <br>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>


<script>

function updateBalance() {

    let points =
        Number(localStorage.getItem("surveyPoints")) || 0;

    document.getElementById("balance").textContent = points;
}

updateBalance();


function requestWithdrawal() {

    const method =
        document.getElementById("method").value;

    const account =
        document.getElementById("account").value.trim();

    const amount =
        Number(document.getElementById("amount").value);


    let points =
        Number(localStorage.getItem("surveyPoints")) || 0;


    if (!account) {
        alert("Please enter your phone or account number.");
        return;
    }


    if (!amount || amount <= 0) {
        alert("Please enter a valid withdrawal amount.");
        return;
    }


    if (amount > points) {
        alert("You do not have enough points.");
        return;
    }


    // Deduct points
    points -= amount;

    localStorage.setItem(
        "surveyPoints",
        points
    );


    // Get existing transactions
    let transactions =
        JSON.parse(
            localStorage.getItem("surveyTransactions")
        ) || [];


    // Add withdrawal transaction
    transactions.unshift({

        type: "withdrawal",

        description:
            "Withdrawal via " +
            method +
            " (" +
            account +
            ")",

        amount: amount,

        status: "Pending",

        date: new Date().toLocaleString()

    });


    // Save transactions
    localStorage.setItem(
        "surveyTransactions",
        JSON.stringify(transactions)
    );


    alert(
        "Withdrawal request submitted successfully!"
    );


    // Go to transaction history
    window.location.href =
        "transactions.html";
}

</script>

</body>
</html>
